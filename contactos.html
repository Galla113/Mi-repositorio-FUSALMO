<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mis contactos</title>
	<meta name="description" content="Contactos de Guillermo Antonio Arévalo Herrera">
</head>

<body>
	<header>
		<h1>Mis contactos</h1>
		<nav>
			<h2><a href="./index.html">Inicio</a></h2>
			<h2><a href="./proyectos.html">Proyectos</a></h2>
			<h2><a href="./contactos.html">Enlaces</a></h2>
		</nav>
	</header>
	<main>
		<ul>
			<li>
				<a href="https://github.com/Galla113">
					<h2>Github</h2>
				</a>
			</li>
			<li>
				<a href="https://www.linkedin.com/in/guillermo-ar%C3%A9valo-892815443/">
					<h2>LinkedIn</h2>
				</a>
			</li>
		</ul>
		<br><br>
		<form action="/procesar" method="POST">
			<fieldset>
				<legend>Formulario de contacto</legend>
				<label for="nombre">Nombre:</label>
				<input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre completo" maxlength="50"
					required><br><br>

				<label for="email">Correo electrónico:</label>
				<input type="email" id="email" name="email" placeholder="Ingrese su correo electrónico" required><br><br>

				<label for="asunto">Asunto:</label><br>
				<select id="asunto" name="asunto" required>
					<option value="" selected disabled>Seleccione un asunto</option>
					<option value="1">Oferta de empleo</option>
					<option value="2">Solicitud de proyecto</option>
					<option value="3">Otros</option>
				</select><br><br>

				<label for="mensaje">Mensaje:</label><br>
				<textarea id="mensaje" name="mensaje" rows="4" cols="50" required></textarea><br><br>

				<input type="submit" value="Enviar">
			</fieldset>
		</form>
	</main>

	<footer>
		<p>&copy; 2026 Guillermo Arévalo · Ahuachapan, El Salvador</p>
	</footer>
</body>

</html>
